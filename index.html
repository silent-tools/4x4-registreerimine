<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>4x4 Registreerimine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap">
<style>
body{margin:0}img{max-width:100%}
/* Layout: üks kitsas tööveerg; ülal võistlusnumbri "numbritahvel", all vormi plokid */
:root{
  --bg:#f2f3ee; --surface:#ffffff; --fg:#1d2219; --muted:#5d6656; --line:#d5d9cc;
  --accent:#4b6a2a; --accent-fg:#ffffff; --plate:#f2c230; --plate-fg:#15170f;
  --ok:#2f7d3a; --err:#b3261e; --warn-bg:#fff4cc; --warn-fg:#5a4500;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141712; --surface:#1d211a; --fg:#e7eadf; --muted:#9aa38f; --line:#353b2f;
  --accent:#8fb35a; --accent-fg:#10140c; --plate:#e7b923; --plate-fg:#15170f;
  --ok:#6cc27a; --err:#ff8a80; --warn-bg:#3a3214; --warn-fg:#f1dc95; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141712; --surface:#1d211a; --fg:#e7eadf; --muted:#9aa38f; --line:#353b2f;
  --accent:#8fb35a; --accent-fg:#10140c; --plate:#e7b923; --plate-fg:#15170f;
  --ok:#6cc27a; --err:#ff8a80; --warn-bg:#3a3214; --warn-fg:#f1dc95; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:20px}
header{display:flex;justify-content:flex-end}
.hero{position:relative;border:3px solid #1d2219;border-radius:12px;overflow:hidden;aspect-ratio:800/320;max-width:100%;background:#9fd3ea}
.hero svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-text{position:relative;padding:18px 20px;max-width:440px}
.hero-text h1{color:#1d2219;font-size:clamp(24px,4.2vw,36px)}
.hero-text .sub{color:#2c3a24;font-weight:600}
@media (max-width:560px){.hero{aspect-ratio:auto;height:270px;background:#bfe4f3}.hero-text{padding:14px}}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,44px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--fg);font:600 14px var(--f-body);padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.demo{background:var(--warn-bg);color:var(--warn-fg);border-radius:6px;padding:10px 14px;font-size:14px}
nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line)}
nav.tabs button{border:0;background:none;color:var(--muted);font:600 15px var(--f-body);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;display:grid;gap:20px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button{border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:16px;text-align:left;cursor:pointer;font:inherit}
.choice button strong{display:block;font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.choice button span{color:var(--muted);font-size:14px}
.choice button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
fieldset{border:0;margin:0;padding:0;display:grid;gap:14px}
legend{font-family:var(--f-display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.full{grid-column:1/-1}
label{display:grid;gap:4px;font-weight:500;font-size:14px;align-content:start}
[hidden]{display:none!important}
#reg,#lookup{display:grid;gap:28px}
.num{font-variant-numeric:tabular-nums}
label .req{color:var(--err)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--err)}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.04em;text-transform:uppercase}
.hint{color:var(--muted);font-size:13px;font-weight:400}
.checks{display:grid;gap:6px}.checks .lbl{font-weight:500;font-size:14px}
.checkrow{display:flex;flex-wrap:wrap;gap:10px}
.check{display:flex;grid-template-columns:none;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:9px 12px;background:var(--bg);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.check:has(input:checked){border-color:var(--accent)}
.numrow{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.plate{width:118px;aspect-ratio:4/3;max-width:100%;background:var(--plate);color:var(--plate-fg);border:3px solid var(--plate-fg);border-radius:10px;
  display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.plate.empty{opacity:.45}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:6px;background:var(--accent);color:var(--accent-fg);font:600 16px var(--f-body);padding:11px 20px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:14px}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
.done{text-align:center;display:grid;gap:12px;justify-items:center}
.done h2{font-family:var(--f-display);text-transform:uppercase;font-size:30px;margin:0}
.done p{margin:0;max-width:52ch}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--muted)}
td.nr{font-family:var(--f-display);font-weight:800;font-size:22px;width:70px}
.count{color:var(--muted);font-size:14px}
@media (max-width:560px){.grid,.choice{grid-template-columns:1fr}.numrow{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Mudatilgad */
.hero-wrap{position:relative}
.panel{position:relative;overflow:hidden}

/* Poriplekid */
.panel>*{position:relative;z-index:1}
.panel>.mud-deco{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.mud-deco .sp{position:absolute;aspect-ratio:1;opacity:var(--o);mix-blend-mode:multiply}
.mud-deco svg{width:100%;height:100%;display:block;overflow:visible}
.mud-deco path,.mud-deco circle,.mud-deco ellipse{fill:#6b4524}
.mud-deco .ln{fill:none;stroke:#6b4524}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mud-deco .sp{mix-blend-mode:normal;opacity:calc(var(--o)*.8)}}
:root[data-theme="dark"] .mud-deco .sp{mix-blend-mode:normal;opacity:calc(var(--o)*.8)}

/* Kood, numbrid, lisanumbrid */
.gate-row{display:flex;gap:10px;flex-wrap:wrap}
.gate-row input{flex:1 1 200px;font-size:20px;letter-spacing:.12em;text-transform:uppercase}
.gate-hint{margin:0}
#main{display:grid;gap:20px}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;opacity:0}
.plate.long{font-size:40px}
.mainnum{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.mainnum strong{font-family:var(--f-display);font-size:24px}
.free{color:var(--err);font-weight:600;flex-basis:100%}
.lbl{font-weight:500;font-size:14px}
.extras{display:grid;gap:10px}
.extras-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.price{font-weight:600;background:var(--warn-bg);color:var(--warn-fg);border-radius:4px;padding:2px 8px;font-size:14px}
.extra-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qty{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--bg)}
.qty>.num{font-family:var(--f-display);font-size:20px;font-weight:600}
.qty-in{display:flex;align-items:center;gap:6px;color:var(--muted)}
.qty input{width:72px;text-align:right;background:var(--surface)}
.qty-name{display:grid;gap:0}.qty-name small{color:var(--muted);font-size:13px}
.total{display:flex;justify-content:flex-end;align-items:baseline;gap:12px;font-weight:600;border-top:2px solid var(--line);padding-top:10px}
.total strong{font-family:var(--f-display);font-size:28px}
.pay{display:grid;gap:12px;border:2px dashed var(--line);border-radius:8px;padding:14px 16px;background:var(--bg)}
.pay-lead{margin:0;font-weight:600}
.bank{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 16px;margin:0;font-size:15px}
.bank dt{color:var(--muted)}.bank dd{margin:0;overflow-wrap:anywhere}
.copy{margin-left:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:4px;font:500 12px var(--f-body);padding:2px 8px;cursor:pointer}
.check{display:flex;gap:10px;align-items:center;font-weight:500;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.done-pay{background:var(--warn-bg);color:var(--warn-fg);border-radius:6px;padding:10px 14px;text-align:left}
@media (max-width:420px){.bank{grid-template-columns:1fr}.bank dt{margin-top:6px}}
@media (max-width:560px){.extra-rows{grid-template-columns:1fr}}
</style>
</head>

    <!-- KOOD (botikaitse) -->
    <form id="gate" novalidate>
      <fieldset>
        <legend data-i18n="gateTitle"></legend>
        <p class="hint gate-hint" data-i18n="gateHint"></p>
        <div class="gate-row">
          <input id="g-code" autocomplete="off" required>
          <button class="btn" type="submit" data-i18n="gateBtn"></button>
        </div>
        <span id="g-msg" class="msg" role="status"></span>
      </fieldset>
    </form>

    <div id="main" hidden>
    <div class="choice" role="group">
      <button id="mode-new" type="button" aria-pressed="true"><strong data-i18n="modeNew"></strong><span data-i18n="modeNewHint"></span></button>
      <button id="mode-change" type="button" aria-pressed="false"><strong data-i18n="modeChange"></strong><span data-i18n="modeChangeHint"></span></button>
    </div>

    <!-- muudatuse tuvastus -->
    <form id="lookup" hidden novalidate>
      <fieldset>
        <legend data-i18n="lookupTitle"></legend>
        <div class="grid">
          <label><span data-i18n="fNr"></span><input id="lk-nr" class="mono" required></label>
          <label><span data-i18n="fEmail"></span><input id="lk-email" type="email" required></label>
        </div>
        <div class="actions"><button class="btn" type="submit" data-i18n="lookupBtn"></button><span id="lk-msg" class="msg" role="status"></span></div>
      </fieldset>
    </form>

    <form id="reg" novalidate>
      <input id="f-hp" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <fieldset>
        <legend data-i18n="secRace"></legend>
        <div class="numrow">
          <div class="plate empty" id="plate" aria-hidden="true">–</div>
          <div class="grid">
            <label><span><span data-i18n="fClass"></span> <span class="req">*</span></span>
              <select id="f-class" required></select></label>
            <label><span><span data-i18n="fNr"></span> <span class="req">*</span></span>
              <select id="f-nr" class="num" required disabled></select>
              <span class="hint" id="free-hint"></span></label>
            <label class="full"><span><span data-i18n="fTeam"></span> <span class="req">*</span></span><input id="f-team" required></label>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="secMachine"></legend>
        <div class="grid">
          <label class="full"><span><span data-i18n="fMachine"></span> <span class="req">*</span></span><input id="f-machine" required data-ph="phMachine"></label>
          <label><span><span data-i18n="fVin"></span> <span class="req">*</span></span><input id="f-vin" class="mono" maxlength="17" required></label>
          <label><span data-i18n="fReg"></span><input id="f-reg" class="mono"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="secCrew"></legend>
        <div class="grid">
          <label><span><span data-i18n="fDriver"></span> <span class="req">*</span></span><input id="f-driver" required autocomplete="name"></label>
          <label><span><span data-i18n="fCo"></span> <span class="req" id="co-req">*</span></span><input id="f-co" required>
            <span class="hint" id="co-hint" hidden data-i18n="coHint"></span></label>
          <label class="full"><span data-i18n="fNote"></span><textarea id="f-note" data-ph="phNote"></textarea></label>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="secContact"></legend>
        <div class="grid">
          <label><span><span data-i18n="fCountry"></span> <span class="req">*</span></span><input id="f-country" list="countries" required></label>
          <label><span><span data-i18n="fEmail"></span> <span class="req">*</span></span><input id="f-email" type="email" required autocomplete="email"></label>
          <label><span><span data-i18n="fPhone"></span> <span class="req">*</span></span><input id="f-phone" type="tel" required autocomplete="tel" placeholder="+372 5123 4567">
            <span class="hint" data-i18n="phoneHint"></span></label>

            <dt data-i18n="regCode"></dt><dd class="num">11092599</dd>
            <dt data-i18n="vat"></dt><dd class="num">EE100941072</dd>
            <dt>IBAN</dt><dd class="num iban">EE692200221026598634 <button type="button" class="copy" id="copy-iban" data-i18n="copy"></button></dd>
            <dt>SWIFT</dt><dd class="num">HABAEE2X</dd>
            <dt data-i18n="payRef"></dt><dd id="pay-ref"></dd>
            <dt data-i18n="contact"></dt><dd>+372 655 6201 · info@printwell.ee</dd>

      <legend data-i18n="listTitle" style="margin:0"></legend>

<script>
/* ============ SEADISTUS ============ */
const BIG = { main: "30x45 cm", extra: ["30x45 cm", "15x22 cm"] };
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbwPFoFxE0CKdbZMnNX3qIbU5_rlGIrvx6KC-R7DtkUPohZDaIXj96ixd7dHvNrBJFKP/exec",            // Apps Scripti veebirakenduse URL. Tühi = näidisrežiim.
  PRICES: { "6x6 cm": 8, "12x12 cm": 12, "15x22 cm": 15, "30x45 cm": 20 },  // lisanumbri hind € / tk
  // numbrid: prefix + kahekohaline osa (from..to)
  CLASSES: [
    { id: "ATV",          prefix: "",   from: 1, to: 99, main: "12x12 cm", extra: ["6x6 cm", "12x12 cm"], coOptional: true },
    { id: "TRO",          prefix: "0",  from: 1, to: 99, ...BIG },
    { id: "TR1",          prefix: "1",  from: 0, to: 99, ...BIG },
    { id: "TR2",          prefix: "2",  from: 0, to: 99, ...BIG },
    { id: "TR3",          prefix: "3",  from: 0, to: 99, ...BIG },
    { id: "Veok",         prefix: "4",  from: 0, to: 99, ...BIG },
    { id: "ADV / LV-TRO", prefix: "LV", from: 1, to: 99, ...BIG }
  ]
};

/* ============ TÕLKED ============ */
const T = {
  et:{title:"4x4 Offroad registreerimine",subtitle:"Võistleja ja masina registreerimine",
    demo:"Näidisrežiim: andmed ei salvestu. Registreerimiskood on MUDA.",
    tabForm:"Registreerimine",tabList:"Registreerunud",
    gateTitle:"Registreerimiskood",gateHint:"Sisesta korraldaja antud kood, et registreerimisega alustada.",gateBtn:"Alusta",gateFail:"Kood ei ole õige.",
    modeNew:"Uus registreering",modeNewHint:"Registreerin esimest korda",
    modeChange:"Muudatus",modeChangeHint:"Muudan juba saadetud andmeid",
    lookupTitle:"Leia oma registreering",lookupBtn:"Ava registreering",
    lookupFail:"Sellise numbri ja e-posti kombinatsiooniga registreeringut ei leitud.",lookupOk:"Registreering leitud. Muuda andmeid ja salvesta.",
    secRace:"Võistlus",secMachine:"Masin",secCrew:"Meeskond",secContact:"Kontakt",secNumbers:"Stardinumbrid",
    fNr:"Võistlusnumber",fClass:"Võistlusklass",fTeam:"Võistkond",fMachine:"Masin",fVin:"VIN",fReg:"Reg. nr",
    fDriver:"Juht",fCo:"Kaasvõistleja",coHint:"ATV klassis ei ole kohustuslik.",fNote:"Märkus",fCountry:"Riik",fEmail:"E-post",fPhone:"GSM",phoneHint:"Koos riigikoodiga, nt +372 5123 4567",fAddress:"Aadress",
    fMain:"Põhinumber, 2 tk:",mainFree:"Põhinumbrid on registreerunutele tasuta.",fExtra:"Lisanumbrite tellimus",unit:p=>`${p} € / tk`,qty:"tk",total:"Lisanumbrid kokku",payee:"Saaja",regCode:"Reg. nr",vat:"KMKR",payRef:"Selgitus",contact:"Kontakt",copy:"Kopeeri",copied:"Kopeeritud",invoice:"Soovin maksta arvega",payLead:n=>`Kanna ${n} € alljärgnevale kontole:`,donePay:(n,r)=>`Lisanumbrite eest tasu ${n} € Printwell OÜ kontole EE692200221026598634, selgitus „${r}”.`,doneInvoice:n=>`Valisid lisanumbrite (${n} €) eest arvega maksmise.`,
    pickClassFirst:"Vali kõigepealt võistlusklass.",
    phMachine:"nt Toyota Land Cruiser 80",phNote:"nt lisa kaasvõistleja autos",
    pickNr:"Vali number",pickClass:"Vali klass",freeCount:n=>`${n} vaba numbrit selles klassis`,
    submitNew:"Saada registreering",submitChange:"Salvesta muudatused",sending:"Saadan…",
    missing:"Täida tärniga väljad.",badEmail:"E-posti aadress ei ole korrektne.",badPhone:"Telefoninumber peab algama riigikoodiga, nt +372.",
    taken:"See number võeti vahepeal ära. Vali teine number.",badCode:"Registreerimiskood ei kehti. Laadi leht uuesti.",fail:"Salvestamine ei õnnestunud. Proovi uuesti.",
    doneNew:"Registreering vastu võetud",doneChange:"Muudatused salvestatud",
    doneText:(nr,em)=>`Sinu võistlusnumber on ${nr}. Andmete muutmiseks vali „Muudatus” ja sisesta number ${nr} ning e-post ${em}.`,
    again:"Tagasi vormi juurde",listTitle:"Registreerunud võistkonnad",colNr:"Nr",colTeam:"Võistkond",listCount:n=>`${n} võistkonda`,listEmpty:"Registreerunuid veel pole."},
  en:{title:"4x4 Offroad registration",subtitle:"Competitor and vehicle registration",
    demo:"Demo mode: data is not saved. The registration code is MUDA.",
    tabForm:"Registration",tabList:"Entry list",
    gateTitle:"Registration code",gateHint:"Enter the code from the organiser to start registering.",gateBtn:"Start",gateFail:"The code is not correct.",
    modeNew:"New entry",modeNewHint:"Registering for the first time",
    modeChange:"Change",modeChangeHint:"Editing an entry I already sent",
    lookupTitle:"Find your entry",lookupBtn:"Open entry",
    lookupFail:"No entry found with this number and e-mail.",lookupOk:"Entry found. Edit the details and save.",
    secRace:"Race",secMachine:"Vehicle",secCrew:"Crew",secContact:"Contact",secNumbers:"Race numbers",
    fNr:"Race number",fClass:"Class",fTeam:"Team",fMachine:"Vehicle",fVin:"VIN",fReg:"Reg. no",
    fDriver:"Driver",fCo:"Co-driver",coHint:"Not required in the ATV class.",fNote:"Notes",fCountry:"Country",fEmail:"E-mail",fPhone:"Mobile",phoneHint:"With country code, e.g. +372 5123 4567",fAddress:"Address",
    fMain:"Main number, 2 pcs:",mainFree:"Main numbers are free for registered competitors.",fExtra:"Extra numbers order",unit:p=>`${p} € / pc`,qty:"pcs",total:"Extra numbers total",payee:"Payee",regCode:"Reg. no",vat:"VAT no",payRef:"Reference",contact:"Contact",copy:"Copy",copied:"Copied",invoice:"I want to pay by invoice",payLead:n=>`Transfer ${n} € to the account below:`,donePay:(n,r)=>`Pay ${n} € for extra numbers to Printwell OÜ, IBAN EE692200221026598634, reference “${r}”.`,doneInvoice:n=>`You chose to pay for the extra numbers (${n} €) by invoice.`,
    pickClassFirst:"Choose the class first.",
    phMachine:"e.g. Toyota Land Cruiser 80",phNote:"e.g. extra co-driver in the car",
    pickNr:"Choose number",pickClass:"Choose class",freeCount:n=>`${n} numbers free in this class`,
    submitNew:"Send entry",submitChange:"Save changes",sending:"Sending…",
    missing:"Fill in the fields marked with a star.",badEmail:"The e-mail address is not valid.",badPhone:"The phone number must start with the country code, e.g. +372.",
    taken:"This number was just taken. Choose another one.",badCode:"The registration code is not valid. Reload the page.",fail:"Saving failed. Please try again.",
    doneNew:"Entry received",doneChange:"Changes saved",
    doneText:(nr,em)=>`Your race number is ${nr}. To edit your details, choose “Change” and enter number ${nr} and e-mail ${em}.`,
    again:"Back to the form",listTitle:"Registered teams",colNr:"No",colTeam:"Team",listCount:n=>`${n} teams`,listEmpty:"No entries yet."}
};

/* ============ ABI ============ */
const cls = id => CONFIG.CLASSES.find(c => c.id === id);
const numbersFor = c => { const a=[]; for(let i=c.from;i<=c.to;i++) a.push(c.prefix+String(i).padStart(2,"0")); return a; };
const normNr = s => String(s||"").trim().toUpperCase();
const classOrder = id => CONFIG.CLASSES.findIndex(c => c.id === id);
const sortList = l => l.sort((a,b)=>classOrder(a.klass)-classOrder(b.klass)||a.nr.localeCompare(b.nr,undefined,{numeric:true}));
const fmtExtras = m => Object.entries(m).filter(([,q])=>q>0).map(([s,q])=>`${s}: ${q} tk`).join("; ");
const parseExtras = s => Object.fromEntries(String(s||"").split("; ").map(x=>x.match(/^(.*): (\d+) tk$/)).filter(Boolean).map(m=>[m[1],+m[2]]));
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============ ANDMEKIHT ============ */
// Näidisrežiimi "server" mälus. Päris režiimis läheb kõik Apps Scripti.
const DEMO_CODE = "MUDA";
const demoDb = [
  {nr:"07",klass:"ATV",voistkond:"Porikärbsed",email:"demo@naide.ee"},
  {nr:"012",klass:"TRO",voistkond:"Kivirullid",email:"demo@naide.ee"},
  {nr:"207",klass:"TR2",voistkond:"Rabakonnad",email:"demo@naide.ee"},
  {nr:"344",klass:"TR3",voistkond:"Metsavennad Racing",email:"demo@naide.ee"},
  {nr:"401",klass:"Veok",voistkond:"Raskekaal",email:"demo@naide.ee"},
  {nr:"LV05",klass:"ADV / LV-TRO",voistkond:"Daugavas Dubļi",email:"demo@naide.ee"}
];
const demoApi = {
  check({code}){return String(code).trim().toUpperCase()===DEMO_CODE?{ok:true}:{ok:false,error:"code"}},
  used(){return {ok:true,used:demoDb.map(r=>r.nr)}},
  public(){return {ok:true,list:sortList(demoDb.map(r=>({nr:r.nr,klass:r.klass,voistkond:r.voistkond}))).map(({nr,voistkond})=>({nr,voistkond}))}},
  lookup({code,nr,email}){if(this.check({code}).ok!==true)return {ok:false,error:"code"};
    const r=demoDb.find(x=>x.nr===normNr(nr)&&x.email.toLowerCase()===String(email).trim().toLowerCase());return r?{ok:true,record:{...r}}:{ok:false,error:"notfound"}},
  save({code,mode,data,auth}){
    if(this.check({code}).ok!==true)return {ok:false,error:"code"};
    if(data.website)return {ok:false,error:"bot"};
    const nr=normNr(data.nr);
    if(mode==="new"){ if(demoDb.some(r=>r.nr===nr))return {ok:false,error:"taken"}; demoDb.push({...data,nr}); return {ok:true}}
    const i=demoDb.findIndex(r=>r.nr===normNr(auth.nr)&&r.email.toLowerCase()===auth.email.toLowerCase());
    if(i<0)return {ok:false,error:"notfound"};
    if(nr!==normNr(auth.nr)&&demoDb.some(r=>r.nr===nr))return {ok:false,error:"taken"};
    demoDb[i]={...demoDb[i],...data,nr}; return {ok:true};
  }
};
async function api(action,payload={}){
  const body={action,code:accessCode,...payload};
  if(!CONFIG.API_URL){await new Promise(r=>setTimeout(r,200));return demoApi[action](body)}
  const res=await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  return res.json();
}

/* ============ KASUTAJALIIDES ============ */
const $=id=>document.getElementById(id);
let lang=/^et\b/i.test(navigator.language||"et")?"et":"en", mode="new", auth=null, used=new Set(), accessCode="";
const FIELDS={voistkond:"f-team",masin:"f-machine",vin:"f-vin",regnr:"f-reg",juht:"f-driver",kaasvoistleja:"f-co",
  markus:"f-note",riik:"f-country",email:"f-email",gsm:"f-phone",aadress:"f-address"};

function t(k,...a){const v=T[lang][k];return typeof v==="function"?v(...a):v}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll("[data-ph]").forEach(el=>el.placeholder=t(el.dataset.ph));
  $("lang-et").setAttribute("aria-pressed",lang==="et");$("lang-en").setAttribute("aria-pressed",lang==="en");
  $("submit-btn").textContent=mode==="new"?t("submitNew"):t("submitChange");
  const c=$("f-class").value; fillClass(c); if(c) onClass($("f-nr").value, readExtras());
  $("demo-banner").hidden=!!CONFIG.API_URL;
  if(!$("view-list").hidden)loadList();
}
function fillClass(keep){
  $("f-class").innerHTML=`<option value="">${t("pickClass")}</option>`+CONFIG.CLASSES.map(c=>`<option>${esc(c.id)}</option>`).join("");
  $("f-class").value=keep||"";
}
function onClass(keepNr, keepExtras){
  const c=cls($("f-class").value), s=$("f-nr");
  if(!c){s.innerHTML=`<option value="">${t("pickNr")}</option>`;s.disabled=true;$("free-hint").textContent="";
    $("main-size").textContent="–";$("extra-rows").innerHTML=`<span class="hint">${t("pickClassFirst")}</span>`;updatePlate();updateTotal();return}
  const own = mode==="change"&&auth?normNr(auth.nr):null;
  const all=numbersFor(c), free=all.filter(n=>!used.has(n)||n===own);
  s.disabled=false;
  s.innerHTML=`<option value="">${t("pickNr")}</option>`+free.map(n=>`<option>${n}</option>`).join("");
  s.value=keepNr&&free.includes(keepNr)?keepNr:"";
  $("free-hint").textContent=t("freeCount",all.filter(n=>!used.has(n)).length);
  // kaasvõistleja
  const co=$("f-co"); co.required=!c.coOptional; $("co-req").hidden=!!c.coOptional; $("co-hint").hidden=!c.coOptional;
  if(c.coOptional)co.removeAttribute("aria-invalid");
  // numbrid
  $("main-size").textContent=c.main;
  const ex=keepExtras||{};
  $("extra-rows").innerHTML=c.extra.map((size,i)=>`<label class="qty"><span class="qty-name"><span class="num">${size}</span><small>${t("unit",CONFIG.PRICES[size])}</small></span>
    <span class="qty-in"><input id="f-ex-${i}" type="number" min="0" max="99" step="1" value="${ex[size]||0}" data-size="${esc(size)}" class="num"> ${t("qty")}</span></label>`).join("");
  updatePlate();updateTotal();
}
function extrasTotal(m){return Object.entries(m).reduce((a,[s,q])=>a+(CONFIG.PRICES[s]||0)*q,0)}
function payRef(){return [$("f-nr").value,$("f-team").value.trim()].filter(Boolean).join(" ")||"–"}
function updateTotal(){
  const sum=extrasTotal(readExtras());
  $("extra-total").textContent=sum+" €";
  $("pay").hidden=sum===0; if(sum===0)$("f-invoice").checked=false;
  $("pay-lead").textContent=t("payLead",sum); $("pay-ref").textContent=payRef();
}
function readExtras(){const m={};$("extra-rows").querySelectorAll("input").forEach(i=>m[i.dataset.size]=Math.max(0,Math.min(99,parseInt(i.value)||0)));return m}
function updatePlate(){const v=$("f-nr").value;$("plate").textContent=v||"–";$("plate").classList.toggle("empty",!v);
  $("plate").classList.toggle("long",v.length>=4)}
async function refreshUsed(){const r=await api("used");used=new Set((r.used||[]).map(normNr))}

async function setMode(m){
  mode=m;auth=null;
  $("mode-new").setAttribute("aria-pressed",m==="new");$("mode-change").setAttribute("aria-pressed",m==="change");
  $("lookup").hidden=m!=="change";$("reg").hidden=m==="change";$("done").hidden=true;
  $("reg").reset();$("lookup").reset();$("lk-msg").textContent="";$("reg-msg").textContent="";
  $("reg").querySelectorAll("[aria-invalid]").forEach(e=>e.removeAttribute("aria-invalid"));
  $("submit-btn").textContent=m==="new"?t("submitNew"):t("submitChange");
  await refreshUsed(); onClass();
}
function readForm(){
  const c=cls($("f-class").value);
  const d={nr:$("f-nr").value,klass:$("f-class").value,website:$("f-hp").value};
  for(const[k,id]of Object.entries(FIELDS))d[k]=$(id).value.trim();
  d.pohinumber=c?`${c.main} x 2`:""; const ex=readExtras(); d.lisanumbrid=fmtExtras(ex);
  d.summa=extrasTotal(ex); d.arvega=$("f-invoice").checked&&d.summa>0?"Jah":"";
  return d;
}
function validate(){
  let ok=true;
  $("reg").querySelectorAll("[required]").forEach(el=>{const bad=!el.value.trim();el.setAttribute("aria-invalid",bad);if(bad)ok=false});
  if(!ok)return t("missing");
  const em=$("f-email");if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim())){em.setAttribute("aria-invalid","true");return t("badEmail")}
  const ph=$("f-phone");if(!/^\+\d[\d\s-]{6,}$/.test(ph.value.trim())){ph.setAttribute("aria-invalid","true");return t("badPhone")}
  return null;
}

$("lang-et").onclick=()=>{lang="et";applyLang()};
$("lang-en").onclick=()=>{lang="en";applyLang()};
$("mode-new").onclick=()=>setMode("new");
$("mode-change").onclick=()=>setMode("change");
$("f-class").onchange=()=>onClass(null, readExtras());
$("f-nr").onchange=()=>{updatePlate();updateTotal()};
$("extra-rows").addEventListener("input",updateTotal);
$("f-team").addEventListener("input",updateTotal);
$("copy-iban").onclick=async()=>{const b=$("copy-iban");try{await navigator.clipboard.writeText("EE692200221026598634");b.textContent=t("copied")}
  catch(x){const r=document.createRange();r.selectNodeContents(b.parentNode.firstChild);getSelection().removeAllRanges();getSelection().addRange(r)}};
$("tab-form").onclick=()=>switchTab("form");
$("tab-list").onclick=()=>switchTab("list");
function switchTab(v){$("tab-form").setAttribute("aria-selected",v==="form");$("tab-list").setAttribute("aria-selected",v==="list");
  $("view-form").hidden=v!=="form";$("view-list").hidden=v!=="list";if(v==="list")loadList()}

$("gate").onsubmit=async e=>{
  e.preventDefault();const code=$("g-code").value.trim();const msg=$("g-msg");
  if(!code){msg.className="msg err";msg.textContent=t("gateFail");return}
  accessCode=code;
  const r=await api("check");
  if(!r.ok){accessCode="";msg.className="msg err";msg.textContent=t("gateFail");$("g-code").setAttribute("aria-invalid","true");return}
  $("gate").hidden=true;$("main").hidden=false;setMode("new");
};

$("lookup").onsubmit=async e=>{
  e.preventDefault();const nr=normNr($("lk-nr").value),email=$("lk-email").value.trim();
  if(!nr||!email){$("lk-msg").className="msg err";$("lk-msg").textContent=t("missing");return}
  const r=await api("lookup",{nr,email});
  if(!r.ok){$("lk-msg").className="msg err";$("lk-msg").textContent=r.error==="code"?t("badCode"):t("lookupFail");return}
  auth={nr,email};$("lk-msg").className="msg ok";$("lk-msg").textContent=t("lookupOk");
  await refreshUsed();
  $("f-class").value=r.record.klass||"";
  onClass(normNr(r.record.nr), parseExtras(r.record.lisanumbrid));
  for(const[k,id]of Object.entries(FIELDS))if(r.record[k]!==undefined)$(id).value=r.record[k];
  updateTotal(); $("f-invoice").checked=r.record.arvega==="Jah"&&!$("pay").hidden;
  $("reg").hidden=false;
};

$("reg").onsubmit=async e=>{
  e.preventDefault();const msg=$("reg-msg");const err=validate();
  if(err){msg.className="msg err";msg.textContent=err;return}
  const btn=$("submit-btn");btn.disabled=true;btn.textContent=t("sending");msg.textContent="";
  const data=readForm();
  try{
    const r=await api("save",{mode,data,auth});
    if(!r.ok){msg.className="msg err";
      msg.textContent={taken:t("taken"),code:t("badCode"),notfound:t("lookupFail"),missing:t("missing")}[r.error]||(t("fail")+(r.detail?" ("+r.detail+")":""));
      if(r.error==="taken"){await refreshUsed();onClass(null,readExtras())}return}
    $("reg").hidden=true;$("lookup").hidden=true;$("done").hidden=false;
    $("done-plate").textContent=data.nr;$("done-plate").classList.toggle("long",data.nr.length>=4);$("done-title").textContent=mode==="new"?t("doneNew"):t("doneChange");
    $("done-text").textContent=t("doneText",data.nr,data.email);
    const dp=$("done-pay"); dp.hidden=!data.summa;
    dp.textContent=data.arvega?t("doneInvoice",data.summa):t("donePay",data.summa,[data.nr,data.voistkond].join(" "));
  }catch(x){msg.className="msg err";msg.textContent=t("fail")+" ("+x.message+")"}
  finally{btn.disabled=false;btn.textContent=mode==="new"?t("submitNew"):t("submitChange")}
};
$("again").onclick=()=>setMode(mode);

async function loadList(){
  const r=await api("public");const list=r.list||[];
  $("list-count").textContent=list.length?t("listCount",list.length):t("listEmpty");
  $("list-body").innerHTML=list.map(x=>`<tr><td class="nr">${esc(x.nr)}</td><td>${esc(x.voistkond)}</td></tr>`).join("");
}

fillClass();applyLang();
</script>

</body>
